<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Hao Lun Li</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300&family=DM+Mono:wght@400&family=DM+Sans:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #eef3fa; --ink: #10264a; --muted: #566e94; --accent: #2c66c9; --line: rgba(16, 38, 74, 0.13); }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #070c17; --ink: #e4ecf8; --muted: #8899b6; --accent: #8cb6ff; --line: rgba(190, 210, 240, 0.13); }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 44px;
        background: var(--bg);
        color: var(--ink);
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      .code { font-family: 'DM Mono', monospace; font-size: 0.78rem; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 1.5rem; }
      .heading { font-family: 'Jost', 'Futura', sans-serif; font-weight: 300; font-size: clamp(3rem, 10vw, 7rem); line-height: 0.95; letter-spacing: -0.03em; margin-bottom: 1.5rem; }
      .heading span { color: var(--accent); }
      .sub { color: var(--muted); margin-bottom: 2.5rem; }
      a { align-self: flex-start; color: var(--ink); text-decoration: none; padding-bottom: 0.3rem; border-bottom: 1px solid var(--line); transition: border-color 0.3s; }
      a:hover { border-color: var(--ink); }
      @media (max-width: 600px) { body { padding: 0 16px; } }
    </style>
  </head>
  <body>
    <p class="code">404 · OFF THE MAP</p>
    <h1 class="heading">Page not <span>found.</span></h1>
    <p class="sub">This page doesn't exist (yet).</p>
    <a href="/">← Back to haolun.li</a>
  </body>
</html>
