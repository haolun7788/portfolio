<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Hao Lun Li</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f0f6ff;
        font-family: 'DM Sans', sans-serif;
        gap: 1rem;
      }
      .code { font-family: 'DM Mono', monospace; font-size: 0.85rem; color: #6a8fbf; letter-spacing: 0.1em; }
      .heading { font-family: 'DM Sans', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); color: #1a3a6f; letter-spacing: -0.02em; }
      .sub { font-size: 0.95rem; color: #6a8fbf; }
      .btn {
        margin-top: 1rem;
        padding: 0.6rem 1.4rem;
        background: #1a3a6f;
        color: #f0f6ff;
        border: none;
        border-radius: 2px;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.85rem;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:hover { opacity: 0.75; }
    </style>
  </head>
  <body>
    <p class="code">404</p>
    <h1 class="heading">Page not found.</h1>
    <p class="sub">This page doesn't exist (yet).</p>
    <a href="/" class="btn">Home</a>
  </body>
</html>
